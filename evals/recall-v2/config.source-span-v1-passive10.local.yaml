version: recall-v2
run:
  id: groupmembench-finance-recall-v2-source-span-v1-passive10-20260719-r2
  dataset: GroupMemBench
  manifest: runs/groupmembench-v3-selection/manifest-hint-v1-diagnostic10.json
  output_dir: runs/recall-v2/groupmembench-finance-recall-v2-source-span-v1-passive10-20260719-r2
  parallelism: 2
store:
  dsn_env: EVAL_V2_POSTGRES_DSN
baseline_arm: no_memory
answerer_seed: pax-recall-eval-v2-answerer-1
retry_failed: false
trial_timeout: 8m
runtime_env:
  - OPENCODE_MODEL
  - OPENCODE_VERSION
  - EVAL_V2_JUDGE_MODEL
  - EVAL_V2_JUDGE_THINKING
  - TEAM_MEMORY_EXTRACTOR_MODEL
  - TEAM_MEMORY_PROMPT_VERSION
  - TEAM_MEMORY_EXTRACTION_CONTEXT_MODE
  - TEAM_MEMORY_EXTRACTION_VERSION
  - TEAM_MEMORY_EXTRACTION_CANDIDATE_STRATEGY
  - TEAM_MEMORY_BUILD_EXTRACTION_CANDIDATE_STRATEGY
  - TEAM_MEMORY_BUILD_RECALL_CANDIDATE_STRATEGY
  - TEAM_MEMORY_WORKER_JOB_TIMEOUT
  - TEAM_MEMORY_WORKER_MAX_ATTEMPTS
  - PAXM_EXPECTED_VERSION
output:
  formats: [csv, jsonl, html]
recall:
  deterministic_replay: evals/recall-v2/groupmembench-finance-hard34-replay-v1.json
  hint_replay: evals/recall-v2/groupmembench-finance-hint12-replay-v1.json
  case_annotations: evals/recall-v2/groupmembench-finance-hard30-agent-annotations-v1.json
  min_replay_cases: 30
  min_agent_cases: 10
  max_agent_cases: 10
  diagnostic: true
before_run:
  program: scripts/eval-v3-opencode.sh
  args: [ingest-domain, all]
  env:
    PAX_EVAL_DOMAIN_INGEST_MODE: team-note-only
    PAX_EVAL_HINT_RECALL: "1"
preflight:
  program: scripts/eval-v3-opencode.sh
  args: [preflight, all]
judge:
  program: scripts/eval-v2-judge.sh
arms:
  - name: no_memory
    consumer:
      program: scripts/eval-v3-opencode.sh
      args: [consumer, no_memory_team]
  - name: team_note
    consumer:
      program: scripts/eval-v3-opencode.sh
      args: [consumer, team_note]
  - name: hint_recall_v0
    consumer:
      program: scripts/eval-v3-opencode.sh
      args: [consumer, hint_recall_v0]
